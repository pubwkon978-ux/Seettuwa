<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seettuwa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#07080f;--s1:#0f1120;--s2:#171830;--s3:#1e2040;
  --border:#2a2d50;--border2:#3a3f70;
  --accent:#6c63ff;--accent2:#00e5cc;--accent3:#ff6b9d;
  --warn:#ffbe0b;--danger:#ff4757;--success:#2ed573;
  --text:#e8eaf6;--muted:#7b80a8;--faint:#3a3f60;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
.screen{display:none;min-height:100vh;}
.screen.active{display:flex;}

/* LOGIN */
#s-login{align-items:center;justify-content:center;padding:1.5rem;}
.login-card{background:var(--s1);border:1px solid var(--border);border-radius:24px;padding:2.5rem;width:100%;max-width:400px;text-align:center;}
.login-card .brand{font-size:3rem;margin-bottom:.5rem;}
.login-card h1{font-size:1.6rem;font-weight:800;margin-bottom:.3rem;}
.login-card p{color:var(--muted);font-size:.85rem;margin-bottom:2rem;line-height:1.6;}
.google-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:var(--s2);border:1px solid var(--border2);border-radius:12px;padding:14px;font-family:'Inter',sans-serif;font-size:.95rem;font-weight:700;color:var(--text);cursor:pointer;transition:all .2s;}
.google-btn:hover{border-color:var(--accent);background:var(--s3);}
.google-btn svg{width:22px;height:22px;flex-shrink:0;}

/* USERNAME */
#s-username{align-items:center;justify-content:center;padding:1.5rem;}
.uname-card{background:var(--s1);border:1px solid var(--border);border-radius:24px;padding:2.5rem;width:100%;max-width:400px;text-align:center;}
.up-row{display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:.8rem 1rem;margin-bottom:1.5rem;text-align:left;}
.up-photo{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.up-init{width:38px;height:38px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;flex-shrink:0;}
.up-info{flex:1;min-width:0;}
.up-name{font-size:.88rem;font-weight:700;}
.up-email{font-size:.7rem;color:var(--muted);}
.text-input{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:13px 16px;color:var(--text);font-family:'Inter',sans-serif;font-size:.95rem;font-weight:600;text-align:center;outline:none;transition:border-color .2s;margin-bottom:10px;}
.text-input:focus{border-color:var(--accent);}
.text-input::placeholder{color:var(--muted);font-weight:400;}
.primary-btn{width:100%;background:var(--accent);border:none;border-radius:12px;padding:13px;font-family:'Inter',sans-serif;font-size:.95rem;font-weight:800;color:#fff;cursor:pointer;transition:opacity .2s;}
.primary-btn:hover{opacity:.85;}
.err-msg{color:var(--danger);font-size:.78rem;margin-top:8px;min-height:18px;}

/* WAITING */
#s-waiting{flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;gap:1rem;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.pending-chip{background:rgba(255,190,11,.1);border:1px solid rgba(255,190,11,.3);color:var(--warn);border-radius:20px;padding:6px 16px;font-size:.78rem;font-weight:700;}
.rejected-chip{background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.3);color:var(--danger);border-radius:20px;padding:6px 16px;font-size:.78rem;font-weight:700;}
.btn-out{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 14px;font-family:'Inter',sans-serif;font-size:.78rem;cursor:pointer;transition:all .2s;}
.btn-out:hover{color:var(--danger);border-color:var(--danger);}

/* GAME */
#s-game{flex-direction:column;}
.game-header{background:var(--s1);border-bottom:1px solid var(--border);padding:.9rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;flex-shrink:0;}
.game-header .logo{font-size:1rem;font-weight:800;color:var(--accent);}
.user-pill{display:flex;align-items:center;gap:7px;background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:5px 12px 5px 6px;font-size:.78rem;}
.up-av{width:24px;height:24px;border-radius:50%;object-fit:cover;}
.up-av-init{width:24px;height:24px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:800;}

/* main game layout */
.game-layout{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.game-left{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1.2rem;padding-bottom:200px;}

/* CHAT — fixed bottom panel */
.chat-bottom{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:2px solid var(--border2);z-index:100;display:flex;flex-direction:column;max-height:280px;}
.chat-tab-bar{display:flex;align-items:center;justify-content:space-between;padding:.5rem 1rem;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;}
.chat-tab-bar h3{font-size:.78rem;font-weight:800;display:flex;align-items:center;gap:6px;}
.chat-tab-bar .toggle-arrow{font-size:.7rem;color:var(--muted);transition:transform .2s;}
.chat-tab-bar .toggle-arrow.open{transform:rotate(180deg);}
.chat-body{display:flex;flex-direction:column;overflow:hidden;transition:max-height .3s ease;}
.chat-body.collapsed{max-height:0;overflow:hidden;}
.chat-messages{flex:1;overflow-y:auto;padding:.7rem 1rem;display:flex;flex-direction:column;gap:6px;max-height:160px;}
.chat-messages::-webkit-scrollbar{width:4px;}
.chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* members strip */
.members-panel{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:.9rem 1rem;}
.mp-title{font-size:.65rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:.7rem;}
.members-list-view{display:flex;flex-direction:column;gap:5px;}
.mlv-item{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--border);border-radius:9px;padding:.45rem .7rem;font-size:.8rem;transition:border-color .2s;}
.mlv-item.me{border-color:rgba(108,99,255,.4);background:rgba(108,99,255,.06);}
.mlv-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.mlv-dot.on{background:var(--success);box-shadow:0 0 4px var(--success);}
.mlv-dot.off{background:var(--faint);}
.mlv-name{flex:1;font-weight:700;}
.mlv-badge{font-family:'DM Mono',monospace;font-size:.7rem;padding:2px 7px;border-radius:5px;}
.mlv-badge.picked{background:rgba(108,99,255,.12);border:1px solid rgba(108,99,255,.3);color:var(--accent);}
.mlv-badge.revealed{background:rgba(0,229,204,.1);border:1px solid rgba(0,229,204,.3);color:var(--accent2);}
.mlv-num{font-family:'DM Mono',monospace;color:var(--accent2);font-size:.85rem;}

/* game states */
.wait-box{text-align:center;padding:2rem;}
.wait-box .wi{font-size:3rem;margin-bottom:.8rem;}
.wait-box h2{font-size:1.2rem;font-weight:800;margin-bottom:.4rem;}
.wait-box p{color:var(--muted);font-size:.85rem;line-height:1.6;}

.pick-panel h2{font-size:1.1rem;font-weight:800;margin-bottom:.3rem;}
.pick-sub{color:var(--muted);font-size:.82rem;margin-bottom:1.2rem;}
.cards-pick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
@media(max-width:500px){.cards-pick-grid{grid-template-columns:repeat(4,1fr);}}
.pick-card{aspect-ratio:2/3;background:var(--s1);border:2px solid var(--border);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:all .2s;user-select:none;}
.pick-card:not(.taken):hover{border-color:var(--accent);background:var(--s3);transform:translateY(-3px) scale(1.04);}
.pick-card.taken{opacity:.28;cursor:not-allowed;}
.pick-card .pc-i{font-size:1.3rem;}
.pick-card .pc-l{font-size:.5rem;font-family:'DM Mono',monospace;color:var(--muted);}

.my-card-panel{text-align:center;}
.flip-hint{color:var(--muted);font-size:.78rem;margin-bottom:.8rem;animation:blink 1.8s infinite;}
@keyframes blink{0%,100%{opacity:.6}50%{opacity:1}}
.flip-hint.gone{visibility:hidden;}
.card-scene{width:170px;height:255px;perspective:800px;margin:0 auto 1.2rem;cursor:pointer;}
.card-3d{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,0,.2,1);}
.card-3d.flipped{transform:rotateY(180deg);}
.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--border);}
.cf-back{background:linear-gradient(135deg,#1a1a35,#252550);border-color:var(--accent);}
.cf-back .cbr{width:75px;height:75px;border-radius:50%;border:2px solid rgba(108,99,255,.3);display:flex;align-items:center;justify-content:center;}
.cf-back .cbi{width:50px;height:50px;border-radius:50%;border:2px solid rgba(108,99,255,.5);display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
.cf-back .cbh{font-size:.65rem;color:var(--muted);margin-top:.7rem;}
.cf-back .cbh span{color:var(--accent);}
.cf-front{background:linear-gradient(135deg,#0d2030,#0d2540);border-color:var(--accent2);transform:rotateY(180deg);}
.cf-front .cfn{font-family:'DM Mono',monospace;font-size:4rem;font-weight:500;color:var(--accent2);line-height:1;text-shadow:0 0 25px rgba(0,229,204,.4);}
.cf-front .cfl{font-size:.65rem;color:var(--muted);margin-top:.4rem;}
.cf-front .cfname{font-size:.82rem;font-weight:700;color:var(--text);margin-top:.2rem;}
.revealed-badge{background:rgba(0,229,204,.08);border:1px solid rgba(0,229,204,.25);border-radius:12px;padding:.7rem 1.2rem;color:var(--accent2);font-size:.82rem;font-weight:700;margin-top:.8rem;}

/* live results */
.lr-panel{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:.9rem 1rem;}
.lr-title{font-size:.65rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:.7rem;}
.lr-grid{display:flex;flex-direction:column;gap:4px;}
.lr-row{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:.45rem .7rem;font-size:.78rem;}
.lr-row.me{border-color:rgba(108,99,255,.35);}
.lr-num{font-family:'DM Mono',monospace;color:var(--accent2);width:24px;text-align:center;flex-shrink:0;}
.lr-name{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lr-status{width:7px;height:7px;border-radius:50%;background:var(--faint);flex-shrink:0;}
.lr-status.flipped{background:var(--accent3);box-shadow:0 0 4px var(--accent3);}
.lr-status.picked{background:var(--accent);}

.msg-bubble{max-width:80%;padding:.45rem .7rem;border-radius:12px;font-size:.78rem;line-height:1.5;}
.msg-from-admin{background:rgba(108,99,255,.12);border:1px solid rgba(108,99,255,.25);border-bottom-left-radius:3px;align-self:flex-start;}
.msg-from-me{background:rgba(0,229,204,.08);border:1px solid rgba(0,229,204,.2);border-bottom-right-radius:3px;align-self:flex-end;text-align:right;}
.msg-from-other{background:var(--s2);border:1px solid var(--border);border-bottom-left-radius:3px;align-self:flex-start;}
.msg-broadcast{background:rgba(255,190,11,.07);border:1px solid rgba(255,190,11,.2);align-self:center;text-align:center;font-size:.72rem;color:var(--warn);border-radius:12px;}
.msg-meta{font-size:.58rem;color:var(--muted);margin-bottom:2px;}
.msg-text{color:var(--text);}
.msg-private-tag{font-size:.58rem;color:var(--accent3);margin-top:2px;}
.chat-inp-row{padding:.5rem .8rem .6rem;border-top:1px solid var(--border);flex-shrink:0;display:flex;gap:6px;}
.chat-inp{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:7px 10px;color:var(--text);font-family:'Inter',sans-serif;font-size:.82rem;outline:none;resize:none;min-height:34px;max-height:60px;transition:border-color .2s;}
.chat-inp:focus{border-color:var(--accent);}
.send-btn{background:var(--accent);border:none;border-radius:10px;padding:7px 13px;color:#fff;cursor:pointer;font-size:.9rem;transition:opacity .2s;flex-shrink:0;align-self:flex-end;}
.send-btn:hover{opacity:.85;}
.new-msg-badge{display:inline-flex;align-items:center;justify-content:center;background:var(--accent3);color:#fff;border-radius:50%;width:16px;height:16px;font-size:.6rem;font-weight:800;margin-left:4px;vertical-align:middle;}
.chat-notif{font-size:.65rem;color:var(--accent3);}

.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--s2);border:1px solid var(--border2);border-radius:12px;padding:.8rem 1.2rem;font-size:.82rem;z-index:999;transform:translateY(20px);opacity:0;transition:all .3s;pointer-events:none;max-width:280px;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{border-color:rgba(46,213,115,.4);color:var(--success);}
.toast.error{border-color:rgba(255,71,87,.4);color:var(--danger);}

/* PENDING STATE inside game screen */
.pending-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:2rem;text-align:center;gap:1rem;}
.pending-panel .pp-icon{font-size:3.5rem;}
.pending-panel h2{font-size:1.3rem;font-weight:800;}
.pending-panel p{color:var(--muted);font-size:.87rem;line-height:1.7;max-width:320px;}
.pending-panel .pp-chip{background:rgba(255,190,11,.1);border:1px solid rgba(255,190,11,.3);color:var(--warn);border-radius:20px;padding:6px 18px;font-size:.78rem;font-weight:700;}
.pending-panel .pp-chat-hint{background:rgba(108,99,255,.08);border:1px solid rgba(108,99,255,.25);border-radius:12px;padding:.8rem 1.2rem;font-size:.8rem;color:var(--accent);max-width:300px;}
.rejected-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:2rem;text-align:center;gap:1rem;}
.rejected-panel .rp-icon{font-size:3.5rem;}
.rejected-panel h2{font-size:1.3rem;font-weight:800;color:var(--danger);}
.rejected-panel p{color:var(--muted);font-size:.87rem;line-height:1.7;}
</style>
</head>
<body>

<!-- S1: LOGIN -->
<div class="screen active" id="s-login">
  <div class="login-card">
    <div class="brand">🎴</div>
    <h1>Seettuwa</h1>
    <p>Sign in with Google
to join the game.</p>
    <button class="google-btn" onclick="signInGoogle()">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.1 0 5.8 1.1 8 2.9l5.9-5.9C34.5 3.3 29.5 1 24 1 14.8 1 7 6.7 3.7 14.6l6.9 5.4C12.3 13.8 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.7c4.3-4 6.8-9.9 6.8-16.9z"/><path fill="#FBBC05" d="M10.6 28.6A14.7 14.7 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-6.9-5.4A23.9 23.9 0 0 0 .5 24c0 3.9.9 7.5 2.6 10.7l7.5-6.1z"/><path fill="#34A853" d="M24 47c5.4 0 10-1.8 13.3-4.8l-7.4-5.7c-1.8 1.2-4.1 2-5.9 2-6.3 0-11.6-4.2-13.5-9.9l-7.5 6.1C7 41.3 14.9 47 24 47z"/></svg>
      Sign in with Google
    </button>
    <div class="err-msg" id="login-err"></div>
  </div>
</div>

<!-- S2: USERNAME -->
<div class="screen" id="s-username">
  <div class="uname-card">
    <div class="up-row" id="up-row"></div>
    <h2 style="font-size:1.2rem;font-weight:800;margin-bottom:.4rem;">ඔයාගේ නම set කරන්න</h2>
    <p style="color:var(--muted);font-size:.82rem;margin-bottom:1.2rem;">Game ඇතුළේ පෙනෙන name type කරලා request send කරන්න</p>
    <input type="text" class="text-input" id="uname-inp" placeholder="ඔයාගේ නම..." maxlength="20" autocomplete="off">
    <button class="primary-btn" onclick="sendRequest()">📨 Send Request to Admin</button>
    <div class="err-msg" id="uname-err"></div>
  </div>
</div>



<!-- S4: GAME -->
<div class="screen" id="s-game">
  <div class="game-header">
    <div class="logo">🎴 Seettuwa</div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="user-pill" id="game-pill"></div>
      <button class="btn-out" onclick="doSignOut()">Leave</button>
    </div>
  </div>
  <div class="game-layout">
    <div class="game-left" id="game-left">
      <div class="wait-box"><div class="wi">⏳</div><h2>Loading...</h2></div>
    </div>
  </div>

  <!-- BOTTOM CHAT BAR — always visible -->
  <div class="chat-bottom" id="chat-bottom" style="display:none;">
    <div class="chat-tab-bar" onclick="toggleChat()">
      <h3>💬 Chat Admin <span id="chat-badge" style="display:none" class="new-msg-badge">!</span>
        <span id="chat-notif" class="chat-notif"></span>
      </h3>
      <span class="toggle-arrow open" id="chat-arrow">▲</span>
    </div>
    <div class="chat-body" id="chat-body">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-inp-row">
        <textarea class="chat-inp" id="chat-inp" placeholder="Admin kata message type karanna..." rows="1"></textarea>
        <button class="send-btn" onclick="sendMsg()">➤</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut as fbSignOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, set, get, onValue, update, push, serverTimestamp, query, orderByChild, limitToLast }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getMessaging, getToken, onMessage }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyC15xoj_yTycj6JKQmNamP_RdHAkRTBKJU",
  authDomain: "seettuwa-8e728.firebaseapp.com",
  databaseURL: "https://seettuwa-8e728-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "seettuwa-8e728",
  storageBucket: "seettuwa-8e728.firebasestorage.app",
  messagingSenderId: "602443508284",
  appId: "1:602443508284:web:43ef7f44080b866525b139"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const messaging = getMessaging(app);

const VAPID_KEY = 'JtKMGivx7ATgB_OUzE_tDPsAJfzIxAQQ66cUUOiHIns';

// Register service worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/firebase-messaging-sw.js').catch(()=>{});
}

// Setup push notifications for this user
async function setupNotifications(uid){
  try {
    const permission = await Notification.requestPermission();
    if(permission !== 'granted') return;
    const token = await getToken(messaging, { vapidKey: VAPID_KEY });
    if(token){
      await set(ref(db, `fcmTokens/${uid}`), { token, updatedAt: Date.now() });
    }
  } catch(e){ console.log('FCM setup:', e.message); }
}

// Foreground message handler (app is open)
onMessage(messaging, payload => {
  const title = payload.notification?.title || 'Seettuwa';
  const body = payload.notification?.body || '';
  toast(`🔔 ${body}`, 'success');
  // Also show browser notification if permitted
  if(Notification.permission === 'granted'){
    new Notification(title, { body, icon: '/favicon.ico' });
  }
});

let me = null;
let myData = null;
let presInt = null;
let reqUnsub = null, gameUnsub = null, memberUnsub = null, onlineUnsub = null, msgUnsub = null;
let membersCache = {};
let lastMsgCount = 0;

window.signInGoogle = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e){ document.getElementById('login-err').textContent = e.message; }
};
window.doSignOut = async () => {
  clearPresence(); clearListeners();
  await fbSignOut(auth);
};

onAuthStateChanged(auth, async user => {
  me = user;
  if(!user){ showScreen('s-login'); return; }
  await routeUser();
});

async function routeUser(){
  const [mSnap, rSnap] = await Promise.all([get(ref(db,`members/${me.uid}`)),get(ref(db,`requests/${me.uid}`))]);
  if(mSnap.exists()){
    myData = mSnap.val();
    enterGame(false);
  } else if(rSnap.exists()){
    const r = rSnap.val();
    if(r.status==='rejected'){
      enterGame(false, 'rejected');
    } else {
      // pending — enter game screen with pending UI, listen for accept
      enterGame(false, 'pending', r.username||r.displayName);
      listenReq(false);
    }
  } else {
    showUname();
  }
}

function showUname(){
  showScreen('s-username');
  const photo = me.photoURL, name = me.displayName||me.email;
  document.getElementById('up-row').innerHTML=`
    ${photo?`<img class="up-photo" src="${esc(photo)}">`:`<div class="up-init">${name[0].toUpperCase()}</div>`}
    <div class="up-info"><div class="up-name">${esc(name)}</div><div class="up-email">${esc(me.email)}</div></div>`;
  document.getElementById('uname-inp').value = me.displayName?me.displayName.split(' ')[0]:'';
}

window.sendRequest = async () => {
  const uname = document.getElementById('uname-inp').value.trim();
  if(!uname){ document.getElementById('uname-err').textContent='Name danna!'; return; }
  if(uname.length<2){ document.getElementById('uname-err').textContent='Tika diga karanna'; return; }
  const mSnap = await get(ref(db,'members'));
  const taken = Object.values(mSnap.val()||{}).some(m=>m.username?.toLowerCase()===uname.toLowerCase());
  if(taken){ document.getElementById('uname-err').textContent='Me name eka use wenawa! Wenas ekak denna.'; return; }
  await set(ref(db,`requests/${me.uid}`),{
    uid:me.uid, username:uname, displayName:me.displayName||uname,
    email:me.email, photoURL:me.photoURL||'', status:'pending', requestedAt:serverTimestamp()
  });
  // Go straight to game screen with pending state — no more waiting screen
  enterGame(false, 'pending', uname);
  listenReq(true); // true = first time, send welcome msg on accept
};

function listenReq(sendWelcome=false){
  if(reqUnsub){ reqUnsub(); reqUnsub=null; }
  reqUnsub = onValue(ref(db,`requests/${me.uid}`), async snap=>{
    const d=snap.val(); if(!d) return;
    if(d.status==='accepted'){
      const mSnap=await get(ref(db,`members/${me.uid}`));
      if(mSnap.exists()){
        myData=mSnap.val();
        if(reqUnsub){reqUnsub();reqUnsub=null;}
        // Send welcome notification message from system
        await push(ref(db,'messages'),{
          role:'system',
          senderName:'Seettuwa',
          to: me.uid,
          text: `✅ Hi ${myData.username}! Admin oba accept karanawa. Oba දැන් group eke member kෙනෙක්. Game ekata join wenawa! 🎴`,
          ts: Date.now()
        });
        enterGame(true); // true = just accepted, show toast
      }
    } else if(d.status==='rejected'){
      enterGame(false, 'rejected');
    }
  });
}

function enterGame(justAccepted=false, pendingState=null, pendingName=''){
  showScreen('s-game');
  const uname = myData?.username || pendingName || me.displayName||'?';
  const photo = me.photoURL;
  document.getElementById('game-pill').innerHTML=`${photo?`<img class="up-av" src="${esc(photo)}">`:`<div class="up-av-init">${uname[0].toUpperCase()}</div>`}<span>${esc(uname)}</span>`;

  if(pendingState==='pending'){
    // Show pending UI inside game screen
    document.getElementById('game-left').innerHTML=`
      <div class="pending-panel">
        <div class="pp-icon">📨</div>
        <h2>Request Sent!</h2>
        <p>Admin oba approve karanamath inna. Oba accept karaata passe automatically game ekata join wenawa.</p>
        <span class="pp-chip">⏳ Pending Approval</span>
        <div class="pp-chat-hint">💬 Chat box eken admin kata message karanna puluwan — screen eke pahala!</div>
      </div>`;
    // Setup chat only (no game listeners yet)
    setupPresenceOnly();
    msgUnsub = onValue(query(ref(db,'messages'),orderByChild('ts'),limitToLast(100)), s=>renderChat(s.val()||{}, true));
    return;
  }

  if(pendingState==='rejected'){
    document.getElementById('game-left').innerHTML=`
      <div class="rejected-panel">
        <div class="rp-icon">😔</div>
        <h2>Request Rejected</h2>
        <p>Admin oba reject karanawa. Wenas Gmail account ekakin try karanna puluwan.</p>
      </div>`;
    return;
  }

  if(justAccepted) toast('🎉 Admin accepted you! Welcome!','success');
  setupPresence();
  // Request notification permission
  if(Notification.permission === 'default') Notification.requestPermission();
  setupListeners();
}

function setupPresence(){
  clearPresence();
  const tick=()=>set(ref(db,`online/${me.uid}`),Date.now());
  tick(); presInt=setInterval(tick,6000);
  window.addEventListener('beforeunload',clearPresence);
}
function setupPresenceOnly(){
  clearPresence();
  // light presence for pending users
  presInt=setInterval(()=>{}, 9999); // placeholder so clearPresence works
}
function clearPresence(){
  if(presInt) clearInterval(presInt);
  if(me) try{set(ref(db,`online/${me.uid}`),null);}catch{}
}
function clearListeners(){
  [gameUnsub,memberUnsub,onlineUnsub,msgUnsub,reqUnsub,notifUnsub].forEach(u=>u&&u());
  gameUnsub=memberUnsub=onlineUnsub=msgUnsub=reqUnsub=notifUnsub=null;
}

function setupListeners(){
  clearListeners();
  let G={}, M={}, O={};
  memberUnsub = onValue(ref(db,'members'), s=>{ M=s.val()||{}; membersCache=M; render(M,G,O); });
  gameUnsub   = onValue(ref(db,'game'),    s=>{ G=s.val()||{}; render(M,G,O); });
  onlineUnsub = onValue(ref(db,'online'),  s=>{ O=s.val()||{}; render(M,G,O); });
  msgUnsub    = onValue(query(ref(db,'messages'),orderByChild('ts'),limitToLast(100)), s=>renderChat(s.val()||{}));
  // DB-based push notifications
  listenNotifications();
}

let notifUnsub = null;
let notifSeenTs = Date.now();
function listenNotifications(){
  if(notifUnsub){ notifUnsub(); notifUnsub=null; }
  notifUnsub = onValue(query(ref(db,`notifications/${me.uid}`), orderByChild('ts'), limitToLast(5)), snap => {
    const data = snap.val();
    if(!data) return;
    Object.values(data).forEach(n => {
      if(n.ts > notifSeenTs){
        notifSeenTs = n.ts;
        showBrowserNotification(n.title, n.body);
      }
    });
  });
}

function showBrowserNotification(title, body){
  // In-app toast always
  toast(`🔔 ${body}`, 'success');
  // Browser notification if permitted
  if(Notification.permission === 'granted'){
    new Notification(title, { body, icon: '/favicon.ico', vibrate: [200,100,200] });
  }
}

function render(members, game, online){
  const now=Date.now();
  const onlineUids = Object.keys(online).filter(uid=>(now-online[uid])<12000);
  const assignments = game.assignments||{};
  const flipped = game.flipped||{};
  const cardCount = game.cardCount||20;
  const memberEntries = Object.entries(members);
  const myUid = me.uid;
  const myNum = assignments[myUid];
  const myFlipped = flipped[myUid];

  if(!members[myUid]){
    document.getElementById('game-left').innerHTML='<div class="wait-box"><div class="wi">😔</div><h2>Removed</h2><p style="color:var(--muted)">Admin oba remove karanawa.</p></div>';
    return;
  }

  // members panel
  const membersHtml = `<div class="members-panel">
    <div class="mp-title">Members (${memberEntries.length})</div>
    <div class="members-list-view">
      ${memberEntries.map(([uid,m])=>{
        const isOnline=onlineUids.includes(uid);
        const num=assignments[uid], isFlipped=flipped[uid];
        const isMe=uid===myUid;
        return `<div class="mlv-item ${isMe?'me':''}">
          <span class="mlv-dot ${isOnline?'on':'off'}"></span>
          <span class="mlv-name">${esc(m.username||m.displayName)}${isMe?' (ඔබ)':''}</span>
          ${isFlipped?`<span class="mlv-badge revealed">✓${num}</span>`:num!==undefined?`<span class="mlv-badge picked">#</span>`:''}
        </div>`;
      }).join('')}
    </div>
  </div>`;

  // results panel (only if game started)
  let resultsHtml='';
  if(game.shuffled){
    resultsHtml=`<div class="lr-panel">
      <div class="lr-title">Live Results</div>
      <div class="lr-grid">
        ${memberEntries.map(([uid,m])=>{
          const num=assignments[uid], isFlipped=flipped[uid], isMe=uid===myUid;
          return `<div class="lr-row ${isMe?'me':''}">
            <div class="lr-num">${isFlipped?num:(num!==undefined?'?':'—')}</div>
            <div class="lr-name">${esc(m.username||m.displayName)}</div>
            <div class="lr-status ${isFlipped?'flipped':num!==undefined?'picked':''}"></div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  // main game area
  let gameHtml='';
  if(!game.shuffled){
    gameHtml=`<div class="wait-box"><div class="wi">⏳</div><h2>Admin cards shuffle karanakam inna...</h2><div class="spinner" style="margin:.8rem auto;"></div></div>`;
  } else if(myNum!==undefined){
    gameHtml=`<div class="my-card-panel">
      <div class="flip-hint ${myFlipped?'gone':''}">👆 Card tap කරලා reveal කරන්න</div>
      <div class="card-scene" onclick="${myFlipped?'':'flipCard()'}">
        <div class="card-3d ${myFlipped?'flipped':''}">
          <div class="card-face cf-back">
            <div class="cbr"><div class="cbi">🎴</div></div>
            <div class="cbh">Tap to <span>reveal</span></div>
          </div>
          <div class="card-face cf-front">
            <div class="cfn">${myNum}</div>
            <div class="cfl">ඔයාගේ lucky number</div>
            <div class="cfname">${esc(myData?.username||'')}</div>
          </div>
        </div>
      </div>
      ${myFlipped?`<div class="revealed-badge">✓ ඔයාට <strong>${myNum}</strong> ලැබුණා!</div>`:''}
    </div>`;
  } else {
    const takenNums=new Set(Object.values(assignments));
    const shuffledOrder=game.shuffledOrder||[];
    gameHtml=`<div class="pick-panel">
      <h2>Card Pick කරන්න</h2>
      <p class="pick-sub">Face-down cards ${cardCount}. ඔයාට ඕන card click!</p>
      <div class="cards-pick-grid">
        ${shuffledOrder.map((num,i)=>{
          const taken=takenNums.has(num);
          return `<div class="pick-card ${taken?'taken':''}" onclick="${taken?'':'pickCard('+i+')'}">
            <div class="pc-i">${taken?'✓':'🎴'}</div>
            <div class="pc-l">${taken?'taken':'#'+(i+1)}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  document.getElementById('game-left').innerHTML = membersHtml + gameHtml + resultsHtml;
}

function renderChat(data){
  const myUid = me?.uid;
  const myUname = myData?.username||me?.displayName||'?';
  const box = document.getElementById('chat-messages');
  const atBottom = box.scrollHeight-box.scrollTop-box.clientHeight<80;
  const msgs = Object.values(data).sort((a,b)=>(a.ts||0)-(b.ts||0));

  // filter: show messages to 'all' or to me or from me
  const visible = msgs.filter(m=>
    m.to==='all' ||
    m.senderUid===myUid ||
    m.to===myUid
  );

  box.innerHTML = visible.map(m=>{
    const isAdmin = m.role==='admin';
    const isFromMe = m.senderUid===myUid;
    const isBroadcast = isAdmin && m.to==='all';
    const isPrivateToMe = m.to===myUid;
    const cls = isBroadcast?'msg-broadcast':isAdmin?'msg-from-admin':isFromMe?'msg-from-me':'msg-from-other';
    const sender = isAdmin?'⚡ Admin':esc(m.senderName||'?');
    return `<div class="msg-bubble ${cls}">
      <div class="msg-meta">${isFromMe?'ඔබ':sender}</div>
      <div class="msg-text">${esc(m.text)}</div>
      ${isPrivateToMe&&isAdmin?`<div class="msg-private-tag">🔒 ඔබට විතරයි</div>`:''}
    </div>`;
  }).join('');

  const newCount = visible.length;
  if(newCount>lastMsgCount){
    const diff=newCount-lastMsgCount;
    if(lastMsgCount>0){
      const badge=document.getElementById('chat-badge');
      badge.style.display='inline-flex';
      badge.textContent=diff;
      const notif=document.getElementById('chat-notif');
      notif.textContent='New message!';
      setTimeout(()=>{badge.style.display='none';notif.textContent='';},3000);
    }
  }
  lastMsgCount=newCount;
  if(atBottom) box.scrollTop=box.scrollHeight;
}

window.sendMsg = async () => {
  const inp = document.getElementById('chat-inp');
  const text = inp.value.trim();
  if(!text) return;
  const uname = myData?.username||me.displayName||'?';
  await push(ref(db,'messages'),{
    role:'member', senderUid:me.uid, senderName:uname,
    to:'all', text, ts:Date.now()
  });
  inp.value='';
};

document.getElementById('chat-inp').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}
});

window.pickCard = async index => {
  const gSnap = await get(ref(db,'game'));
  const game = gSnap.val();
  if(!game?.shuffled) return;
  if(game.assignments?.[me.uid]!==undefined) return;
  const num = game.shuffledOrder?.[index];
  if(num===undefined) return;
  const taken = Object.values(game.assignments||{}).includes(num);
  if(taken){ toast('Card eka taken! Wena ekak try.','error'); return; }
  await update(ref(db,'game/assignments'),{[me.uid]:num});
  toast('Card picked! Flip karanna!','success');
};

window.flipCard = async () => {
  const gSnap = await get(ref(db,'game'));
  const game = gSnap.val();
  if(!game?.assignments?.[me.uid]===undefined) return;
  if(game?.flipped?.[me.uid]) return;
  await update(ref(db,'game/flipped'),{[me.uid]:true});
};

let chatOpen = true;
window.toggleChat = () => {
  chatOpen = !chatOpen;
  document.getElementById('chat-body').classList.toggle('collapsed', !chatOpen);
  document.getElementById('chat-arrow').classList.toggle('open', chatOpen);
};

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  // show chat bar only in game screen
  const cb = document.getElementById('chat-bottom');
  if(cb) cb.style.display = id==='s-game' ? 'flex' : 'none';
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className=`toast show ${type||''}`;setTimeout(()=>t.className='toast',2500);}
window.toast=toast;
</script>
